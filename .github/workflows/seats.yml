name: Seats snapshot

# Barrett rebuilds the schedule files once a day around 06:50 Eastern, which is
# 10:50 UTC in summer and 11:50 UTC in winter. 12:30 UTC lands after both.
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      term:
        description: '4-digit term code for a one-off run, blank for every searchable term'
        required: false
        default: ''
      force:
        description: 'Write even when the run comes back far short of what is committed'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: seats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No term argument on a schedule: the script snapshots every searchable
      # term, and naming one would drop the others from the file.
      - name: Fetch seat counts
        env:
          TERM_INPUT: ${{ inputs.term }}
          FORCE_WRITE: ${{ inputs.force && '1' || '' }}
        run: node scripts/fetch-seats.mjs $TERM_INPUT

      # The fetch exits non-zero when it skipped a term, and the terms it did
      # snapshot are already on disk by then, so commit before the job goes red.
      # !cancelled() is success or failure, so this also commits after a crash.
      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          # One file per term now, so stage by pathspec. -A picks up a term that
          # is new and one that was dropped, and staging a file whose bytes did
          # not move records nothing, so an unchanged term stays out of the diff.
          # The trend files stage here too, or they are written on the runner
          # and never committed.
          git add -A -- data/seats.json 'data/seats-*.json' 'data/trend-*.json'
          if git diff --cached --quiet; then
            echo "No seat file changed, nothing to commit."
            exit 0
          fi
          git diff --cached --name-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update seat counts"
          # The scheduled run and a manual dispatch can overlap, and the branch may have
          # moved on while the fetch was running. Ratings and the course index commit to
          # the same branch on their own schedules.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
