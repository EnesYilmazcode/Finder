name: Seats snapshot

# Barrett rebuilds the schedule files once a day around 06:50 Eastern, which is
# 10:50 UTC in summer and 11:50 UTC in winter. 12:30 UTC lands after both.
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      term:
        description: '4-digit term code for a one-off run, blank for every searchable term'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: seats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No term argument on a schedule: the script snapshots every searchable
      # term, and naming one would drop the others from the file.
      - name: Fetch seat counts
        env:
          TERM_INPUT: ${{ inputs.term }}
        run: node scripts/fetch-seats.mjs $TERM_INPUT

      - name: Commit if changed
        run: |
          # --porcelain rather than git diff so a first run, where the file is not
          # tracked yet, still counts as a change.
          if [ -z "$(git status --porcelain -- data/seats.json)" ]; then
            echo "No change in data/seats.json, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seats.json
          git commit -m "Update seat counts"
          # The scheduled run and a manual dispatch can overlap, and the branch may have
          # moved on while the fetch was running. Ratings and the course index commit to
          # the same branch on their own schedules.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
